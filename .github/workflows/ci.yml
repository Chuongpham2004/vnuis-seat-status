name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop, "feat/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: backend-core (Java 25, Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend-core/pom.xml

      - name: Unit + integration tests
        # Integration tests start throwaway Postgres/Redis/Mosquitto containers via Testcontainers.
        run: ./mvnw -B clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend-core/target/surefire-reports
            backend-core/target/failsafe-reports
          retention-days: 7

      - name: Docker image builds
        working-directory: .
        run: docker build -t smart-library-backend:ci ./backend-core

  frontend-ci:
    name: frontend-web (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Unit + component tests (Vitest)
        run: npm test
      - run: npm run build

      - name: Docker image builds
        working-directory: .
        run: docker build -t smart-library-frontend:ci ./frontend-web

  iot-edge-ci:
    name: iot-edge firmware (PlatformIO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot-edge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('iot-edge/platformio.ini') }}

      - run: pip install platformio

      - name: Unit tests (moving average + debounce, on the host)
        run: pio test -e native

      - name: Firmware compiles for ESP32 DevKit V1
        # No include/config.h in CI: the build falls back to config.example.h.
        run: pio run -e esp32doit-devkit-v1

  python-ci:
    name: iot-simulator (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot-simulator
    services:
      # Plain EMQX (anonymous access) for the real-broker / Last Will test.
      emqx:
        image: emqx/emqx:5.8.6
        ports:
          - 1883:1883
        options: >-
          --health-cmd "/opt/emqx/bin/emqx ctl status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: iot-simulator/pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Unit + broker integration tests
        env:
          SIM_IT_MQTT_HOST: localhost
        run: pytest -q

      - name: Docker image builds
        working-directory: .
        run: docker build -t smart-library-simulator:ci ./iot-simulator

  ai-ci:
    name: ai-service (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Forecasting + assistant tests (deterministic engine, no API keys needed)
        run: pytest -q

      - name: Docker image builds
        working-directory: .
        run: docker build -t smart-library-ai:ci ./ai-service
