[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-service"
version = "0.4.0"
description = "Occupancy forecasting + tool-calling study-space assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "joblib>=1.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pyjwt>=2.9",
    "tzdata>=2024.1",
    # Optional LLM back ends; the built-in deterministic engine needs neither.
    "anthropic>=0.40",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fakeredis>=2.24"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
