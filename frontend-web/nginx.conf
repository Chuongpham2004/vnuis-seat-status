# Serves the SPA and forwards API / WebSocket / simulator calls inside the compose network,
# so the browser only ever talks to this origin (no CORS needed).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve service names at request time, so nginx still starts when a service is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend-core:8080;
    set $simulator http://iot-simulator:8090;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;   # keep host:port so backend-core sees same-origin
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # AI training / LLM replies can be slow
    }

    location /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;   # keep host:port so backend-core sees same-origin
        proxy_read_timeout 1h;
    }

    # Demo control panel -> iot-simulator (strip the /sim prefix).
    location /sim/ {
        rewrite ^/sim/(.*)$ /$1 break;
        proxy_pass $simulator;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
