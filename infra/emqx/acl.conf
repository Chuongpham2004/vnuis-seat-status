%% EMQX topic ACL for the Smart Self-Study Space platform.
%% Rules are checked top to bottom; first match wins. Unmatched = deny
%% (EMQX_AUTHORIZATION__NO_MATCH=deny in docker-compose.yml).

%% backend-core: reads all seat topics, may publish commands under library/.
{allow, {username, "backend"}, all, ["library/#"]}.

%% Virtual seats: publish telemetry/status only.
{allow, {username, "simulator"}, publish, ["library/zone/+/seat/+/telemetry", "library/zone/+/seat/+/status"]}.
{allow, {username, "simulator"}, subscribe, ["library/zone/+/seat/+/cmd"]}.

%% Physical ESP32 nodes (usernames starting with "esp32").
{allow, {username, {re, "^esp32"}}, publish, ["library/zone/+/seat/+/telemetry", "library/zone/+/seat/+/status"]}.
{allow, {username, {re, "^esp32"}}, subscribe, ["library/zone/+/seat/+/cmd"]}.

%% Read-only debugging account (mosquitto_sub, EMQX dashboard WS client).
{allow, {username, "monitor"}, subscribe, ["library/#"]}.

%% Nobody else may touch $SYS or wildcard everything.
{deny, all}.
