# Redis 7 config for the Smart Self-Study Space platform

bind 0.0.0.0
protected-mode no
port 6379

# Publish "expired" keyevents (E = keyevent channel, x = expired).
# backend-core listens on __keyevent@0__:expired for:
#   timer:reservation:expire:{reservation_id}   (15-min no-show)
#   timer:seat:away:{seat_code}                 (30-min away release)
#   timer:seat:walkin:{seat_code}               (2-min walk-in detection)
#   timer:seat:awaypending:{seat_code}          (1-min absence -> AWAY)
notify-keyspace-events Ex

# Expire keys more eagerly so expiry events fire close to their TTL.
hz 50

# Persistence: AOF so seat state / timers survive a container restart.
appendonly yes
appendfsync everysec

maxmemory-policy noeviction
