; ESP32 seat node (DevKit V1 + HC-SR04) for seat A-01.
;   pio run -e esp32doit-devkit-v1              build
;   pio run -e esp32doit-devkit-v1 -t upload    flash
;   pio device monitor                          serial log (115200)
;   pio test -e native                          unit-test the presence filter on the PC

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0

; Host-side unit tests for the hardware-independent PresenceFilter (lib/PresenceFilter).
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
