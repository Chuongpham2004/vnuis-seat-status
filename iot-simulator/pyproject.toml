[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-simulator"
version = "0.3.0"
description = "Virtual HC-SR04 seat nodes over MQTT for the Smart Self-Study Space platform"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "tzdata>=2024.1",  # time zones on Windows (no system tz database)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
seat-sim = "simulator.cli:app"

[tool.setuptools.packages.find]
include = ["simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real MQTT broker (set SIM_IT_MQTT_HOST)"]
